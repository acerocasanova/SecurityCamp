{% extends "base.html" %}

{% block sidebar %}


<ul class="list-unstyled ps-0">
    <li class="mb-1">
        <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed"
            data-bs-toggle="collapse" data-bs-target="#home-collapse" aria-expanded="true">
            Visualizar Camaras
        </button>
        <div class="collapse show" id="home-collapse">
            <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                <li><a href="{% url 'showCamIndex' %}"
                        class="link-dark d-inline-flex text-decoration-none rounded">Inicio</a>
                </li>
            </ul>
        </div>
    </li>
    <li class="border-top my-3"></li>
    <li class="mb-1">
        <button class="btn btn-toggle d-inline-flex align-items-center rounded border-0 collapsed"
            data-bs-toggle="collapse" data-bs-target="#home-collapse" aria-expanded="true">
            Opciones
        </button>
        <div class="collapse show" id="home-collapse">
            <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                {% if total_pantallas %}
                    {% for pantalla in total_pantallas %}
                    <li><a href="{% url 'show_pantalla' numero=1 %}" target="_blank" rel="noopener noreferrer"
                            data-mdb-ripple-init class="link-dark d-inline-flex text-decoration-none rounded">Abrir
                            pantalla</a>
                    </li>
                    {% endfor %}
                {% endif %}
            </ul>
        </div>
    </li>
    <li class="border-top my-3"></li>
</ul>
{% endblock %}
{% block content %}
{% endblock %}

{% extends "record/base.html" %}

{% block content %}
<div class="card mx-auto" style="max-width: 28rem;">
  <img src="{% url 'showVideoCam' %}" width="{{tamanoVideo}}" class="img-fluid rounded-start">
  <div class="card-body">
        <form method="POST" >
          {% csrf_token %}
          <button type="submit" class="btn btn-primary mb-2" name="btn" value="Voler">Voler</button>
          <button type="submit" class="btn btn-primary mb-2" name="btn" value="TomarFoto">Tomar Foto</button>
        </form>
  </div>
</div>
{% endblock %}
